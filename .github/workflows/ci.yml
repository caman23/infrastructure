name: CI

on:
  pull_request:
    branches: [main, develop, release]
  push:
    branches: [main, develop, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: YAML parses
        run: |
          python3 - <<'EOF'
          import glob, yaml
          files = ["render.yaml", "docker-compose.yml", *glob.glob(".github/**/*.yml", recursive=True)]
          for f in files:
              yaml.safe_load(open(f))
              print("ok", f)
          EOF
      - name: docker compose config
        run: docker compose -f docker-compose.yml config --quiet
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Keep-alive Worker trading-window test
        run: node deploy/keepalive-worker/test.mjs
