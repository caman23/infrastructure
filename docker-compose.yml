# Single service for now (in-memory bus + JSONL storage, see docs/adr/0002 and 0003).
# Redis / PostgreSQL+TimescaleDB are added here when those ADRs are revisited.
services:
  astrq:
    # built and pushed by astrq-platform-api (Image workflow); pin a sha-<commit> tag
    # instead of latest for a reproducible VPS deploy. Replace `your-org`.
    image: ghcr.io/your-org/astrq-platform-api:latest
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # must listen on all interfaces inside the container; exposure is limited
      # by the 127.0.0.1 port binding above. Overrides ASTRQ_API__HOST from .env.
      ASTRQ_API__HOST: 0.0.0.0
      ASTRQ_API__PORT: "8000"
    volumes:
      - ./data:/app/data
      # the image ships config/; mount your own copy to override it:
      # - ./config:/app/config:ro
    restart: unless-stopped
